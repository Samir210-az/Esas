<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SECURITY GROUP | İnteraktiv Test Kataloqu</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: #0a0c15;
            overflow-x: hidden;
        }

        /* Dinamik gradient fon – canlı hərəkət edən dalğalar */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(125deg, #0f172a 0%, #1e293b 40%, #0f172a 100%);
        }

        .animated-bg::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle at 30% 50%, rgba(56, 189, 248, 0.15), rgba(139, 92, 246, 0.1) 50%, transparent 80%);
            animation: rotateBg 28s linear infinite;
        }

        .animated-bg::after {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle at 70% 80%, rgba(236, 72, 153, 0.12), rgba(245, 158, 11, 0.08) 60%, transparent 90%);
            animation: rotateBgReverse 35s linear infinite;
            opacity: 0.7;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateBgReverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        /* Şəbəkə zolaqları (grid texture) */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='1' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
            position: relative;
            z-index: 2;
        }

        /* Rəngarəng başlıq – 3D parıltı effekti */
        .security-header {
            text-align: center;
            margin-bottom: 4rem;
            perspective: 600px;
        }

        .security-header h1 {
            font-family: 'Bebas Neue', 'Impact', cursive;
            font-size: 5.8rem;
            font-weight: 700;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #FF416C, #FF4B2B, #F9D423, #00C9FF, #92FE9D);
            background-size: 400% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbowMove 7s linear infinite, floatText 3s ease-in-out infinite;
            text-shadow: 0 0 15px rgba(255,75,43,0.4);
            transform-style: preserve-3d;
        }

        @keyframes rainbowMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes floatText {
            0% { transform: translateY(0px) rotateX(0deg); }
            50% { transform: translateY(-8px) rotateX(2deg); }
            100% { transform: translateY(0px) rotateX(0deg); }
        }

        .glow-badge {
            display: inline-block;
            margin-top: 20px;
            background: rgba(15, 25, 45, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,200,0.2);
            padding: 0.5rem 1.8rem;
            border-radius: 60px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .glow-badge:hover {
            border-color: #facc15;
            box-shadow: 0 0 12px rgba(250,204,21,0.4);
            transform: scale(1.02);
        }

        /* Grid modern */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            justify-items: center;
            align-items: stretch;
        }

        /* Kartlar – neon border, 3D hover */
        .card {
            position: relative;
            width: 100%;
            background: rgba(20, 30, 45, 0.45);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            transform: translateY(0) rotate(0deg);
        }

        .card:hover {
            transform: translateY(-12px) scale(1.01);
            box-shadow: 0 28px 45px -12px black, 0 0 0 2px rgba(255,215,0,0.3) inset, 0 0 18px rgba(255,215,0,0.2);
            background: rgba(25, 35, 55, 0.6);
        }

        /* Şəklin qablama */
        .image-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            transition: all 0.4s;
        }

        .image-wrapper img, .image-wrapper svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.3s;
        }

        .card:hover .image-wrapper img,
        .card:hover .image-wrapper svg {
            transform: scale(1.08);
            filter: brightness(1.05) contrast(1.03);
        }

        /* Overlay text – böyük hərflər, daha modern */
        .overlay-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 70%, transparent 100%);
            backdrop-filter: blur(3px);
            padding: 1.2rem 0.8rem;
            text-align: center;
            transform: translateY(0);
            transition: transform 0.25s ease, backdrop-filter 0.2s;
        }

        .card:hover .overlay-text {
            backdrop-filter: blur(5px);
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 100%);
        }

        .overlay-text span {
            display: inline-block;
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0,0,0,0.8);
            text-transform: uppercase;
            font-family: 'Inter', 'Arial Black', sans-serif;
            background: linear-gradient(135deg, #fff, #facc15);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: none;
            font-weight: 900;
        }

        /* Hover zamanı mətnin rəng oyunu */
        .card:hover .overlay-text span {
            background: linear-gradient(135deg, #FFD966, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
        }

        /* yüklənmə animasiyası (fade-up) */
        @keyframes cardFadeUp {
            0% {
                opacity: 0;
                transform: translateY(40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            opacity: 0;
            animation: cardFadeUp 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }

        /* hər karta ardıcıl gecikmə */
        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.15s; }
        .card:nth-child(3) { animation-delay: 0.25s; }
        .card:nth-child(4) { animation-delay: 0.35s; }
        .card:nth-child(5) { animation-delay: 0.45s; }

        /* ripples effekti (yalnız css ilə tıklama üçün) */
        .card:active {
            transform: scale(0.98);
            transition: transform 0.05s;
        }

        /* Footer */
        .footer-note {
            text-align: center;
            margin-top: 4.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #94a3b8;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            padding: 0.7rem 2rem;
            border: 1px solid rgba(255,255,200,0.15);
        }

        .footer-note span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .grid { gap: 1.2rem; }
            .overlay-text span { font-size: 1.3rem; }
            .security-header h1 { font-size: 3.8rem; letter-spacing: 4px; }
        }
        @media (max-width: 700px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            .overlay-text span { font-size: 1rem; }
            .container { padding: 1.2rem; }
        }
        @media (max-width: 500px) {
            .grid { grid-template-columns: 1fr; gap: 1.5rem; }
            .security-header h1 { font-size: 2.8rem; }
        }

        /* Canvas hissəciklər əlavə etmək üçün kiçik ulduz effekti */
        .star {
            position: fixed;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>
<div class="animated-bg"></div>
<div class="noise-overlay"></div>

<div class="container">
    <div class="security-header">
        <h1>SECURITY GROUP</h1>
        <div class="glow-badge">✦ interaktiv test platforması ✦</div>
    </div>

    <div class="grid" id="dynamicGrid">
        <!-- JS ilə 5 test kartı yaradılacaq -->
    </div>
    <div class="footer-note">
        <span>✨ hər kvadrata klik → yeni səhifədə test ✨</span>
    </div>
</div>

<script>
    (function() {
        // ============================================================
        // YALNIZ ŞƏKİLLƏR DƏYİŞDİRİLDİ – hər testin məzmununa uyğun tematik şəkillər
        // ============================================================
        const testItems = [
            {
                // DENVER II TEST – uşaq inkişafı (pediatrik test üçün uşaq blokları ilə oynayır)
                img: "https://picsum.photos/id/125/600/600",
                url: "https://samir210-az.github.io/goog/",
                title: "DENVER II TEST"
            },
            {
                // CBT QİYMƏTLƏNDİRMƏ – psixologiya, idrak və hisslər (zehin/düşüncə təmsili)
                img: "https://picsum.photos/id/152/600/600",
                url: "https://samir210-az.github.io/cbttest/cbttest",
                title: "CBT QİYMƏTLƏNDİRMƏ"
            },
            {
                // SAAS TEST – proqram təminatı, test avtomatizasiyası (laptop/ekran)
                img: "https://picsum.photos/id/0/600/600",
                url: "https://samir210-az.github.io/saas/",
                title: "SAAS TEST"
            },
            {
                // ERKƏN İNKİŞAF – uşağın erkən bacarıqları (rəsm/yaradıcılıq)
                img: "https://picsum.photos/id/20/600/600",
                url: "https://samir210-az.github.io/TEST/",
                title: "ERKƏN İNKİŞAF"
            },
            {
                // TTAP PEŞƏ SEÇİMİ – karyera, iş alətləri (klaviatura/peşə simvolu)
                img: "https://picsum.photos/id/48/600/600",
                url: "https://samir210-az.github.io/AN/",
                title: "TTAP PEŞƏ SEÇİMİ"
            }
        ];

        const gridContainer = document.getElementById('dynamicGrid');
        if (!gridContainer) return;

        function buildCards() {
            gridContainer.innerHTML = '';
            testItems.forEach((item) => {
                const imageUrl = item.img && item.img.trim() !== "" ? item.img : "https://picsum.photos/id/42/600/600";
                const targetUrl = item.url && item.url.trim() !== "" ? item.url : "#";
                const displayTitle = item.title ? item.title.toUpperCase() : "TEST";

                const card = document.createElement('div');
                card.className = 'card';

                const link = document.createElement('a');
                link.className = 'card-link';
                link.href = targetUrl;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';

                const wrapper = document.createElement('div');
                wrapper.className = 'image-wrapper';

                const img = document.createElement('img');
                img.src = imageUrl;
                img.alt = displayTitle;
                img.loading = 'lazy';
                img.onerror = function() {
                    this.src = "https://picsum.photos/id/42/600/600";
                };
                wrapper.appendChild(img);

                const overlay = document.createElement('div');
                overlay.className = 'overlay-text';
                const span = document.createElement('span');
                span.textContent = displayTitle;
                overlay.appendChild(span);

                link.appendChild(wrapper);
                link.appendChild(overlay);
                card.appendChild(link);
                gridContainer.appendChild(card);
            });
        }

        buildCards();

        // Ulduz fonu (dekorativ)
        function addStars() {
            const starCount = 80;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.opacity = Math.random() * 0.5 + 0.1;
                star.style.animation = `floatStar ${Math.random() * 20 + 10}s infinite linear`;
                star.style.background = `rgba(255, 235, 150, ${Math.random() * 0.6})`;
                document.body.appendChild(star);
            }
        }
        const styleSheet = document.createElement("style");
        styleSheet.textContent = `
            @keyframes floatStar {
                0% { transform: translateY(0px) translateX(0px); opacity: 0; }
                10% { opacity: 0.5; }
                90% { opacity: 0.5; }
                100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
            }
            .star {
                position: fixed;
                pointer-events: none;
                z-index: 1;
                border-radius: 50%;
                background: #ffecb3;
                box-shadow: 0 0 4px #ffdf8c;
            }
        `;
        document.head.appendChild(styleSheet);
        addStars();
    })();
</script>
</body>
</html>
